name: Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'sample-app/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]   # ✅ Task 7: 3 versions
    
    env:                                   # ✅ Task 5: environment variables
      NODE_ENV: test
      LOG_LEVEL: debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Print environment            # ✅ Task 5 proof step
        run: |
          echo "Environment: ${{ env.NODE_ENV }}"
          echo "Log Level: ${{ env.LOG_LEVEL }}"
      
      - name: Dummy build step
        run: echo "✅ Build step simulated"
      
      - name: Dummy test step
        run: echo "✅ Tests simulated"

      # 🔹 Task 8: Create and upload artifact
      - name: Create artifact
        run: echo "Build output for Node ${{ matrix.node-version }}" > output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.node-version }}
          path: output.txt
          retention-days: 7
      
      - name: Check coverage
        if: always()
        run: echo "⚠️ No coverage report found (dummy run)"

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Dummy lint step
        run: echo "✅ Lint simulated"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    
    steps:
      - name: Print test results
        run: |
          echo "🎯 Test Run Summary"
          echo "==================="
          echo "✅ All tests completed"

  # 🔹 Task 8: New job to download artifact
      download-artifact:
    name: Download Artifact
    runs-on: ubuntu-latest
    needs: build-and-test   # 👈 ensures this runs after build-and-test finishes
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-18.x   # 👈 choose which artifact to download (example: from Node 18.x job)
          path: ./downloaded

      - name: Show artifact content
        run: cat ./downloaded/output.txt